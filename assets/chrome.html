<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>SCIFI</title>
<link rel="stylesheet" href="chrome.css">
</head>
<body>
  <div id="tabstrip" role="tablist" aria-label="Tabs"></div>

  <div id="toolbar">
    <button id="back" class="nav-btn" title="Back" aria-label="Back">
      <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true">
        <path d="M12 4.5 6.5 10l5.5 5.5" fill="none" stroke="currentColor"
              stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <button id="fwd" class="nav-btn" title="Forward" aria-label="Forward">
      <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true">
        <path d="M8 4.5 13.5 10 8 15.5" fill="none" stroke="currentColor"
              stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <button id="reload" class="nav-btn" title="Reload" aria-label="Reload">
      <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
        <path d="M15.5 10a5.5 5.5 0 1 1-1.6-3.9" fill="none" stroke="currentColor"
              stroke-width="1.6" stroke-linecap="round"/>
        <path d="M15.5 4.5v3.6h-3.6" fill="none" stroke="currentColor"
              stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <div id="addressbar">
      <span id="security-dot" class="plain" title="Not secure"></span>
      <input id="address" type="text" spellcheck="false" autocomplete="off"
             placeholder="Enter an address">
      <button id="notice-icon" class="notice-icon" hidden title="" aria-label="Navigation notice">
        <svg viewBox="0 0 14 14" width="13" height="13" aria-hidden="true">
          <path d="M7 1 13 12H1Z" fill="none" stroke="currentColor"
                stroke-width="1.3" stroke-linejoin="round"/>
          <path d="M7 5.5v3.2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          <circle cx="7" cy="10.8" r="0.9" fill="currentColor"/>
        </svg>
      </button>
    </div>

    <button id="settings" class="nav-btn" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
        <line x1="4" y1="6" x2="16" y2="6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        <circle cx="8" cy="6" r="1.6" fill="currentColor"/>
        <line x1="4" y1="10" x2="16" y2="10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        <circle cx="13" cy="10" r="1.6" fill="currentColor"/>
        <line x1="4" y1="14" x2="16" y2="14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        <circle cx="10" cy="14" r="1.6" fill="currentColor"/>
      </svg>
    </button>
    <button id="newIncognito" class="nav-btn" title="New incognito tab" aria-label="New incognito tab">
      <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
        <path d="M2.5 7.5h5a2 2 0 1 1 0 4h-5M12.5 7.5h5a2 2 0 1 1 0 4h-5"
              fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M7.5 8.8h5" stroke="currentColor" stroke-width="1.4"/>
      </svg>
    </button>
    <button id="newtab" class="nav-btn" title="New tab" aria-label="New tab">
      <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
        <path d="M10 4.5v11M4.5 10h11" stroke="currentColor"
              stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <script src="chrome.js"></script>
</body>
</html>
